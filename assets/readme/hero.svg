  <g id="hints" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="56" y="506" font-size="20" fill="#6B7180" textLength="1056" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[Enter] Resume  [Ctrl+B] Tree  [Ctrl+G] AI  [Ctrl+A] Project  [Ctrl+R] Regex  [Esc] Quit</text>
