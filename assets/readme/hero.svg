<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">ccs: find the agent session you half remember</title>
  <desc id="desc">The ccs search screen, drawn from its real layout and colors with sample data: the query connection pool timeout finds three sessions from Claude Code, Codex and Opencode, with the matching words highlighted in yellow.</desc>
  <rect width="1200" height="530" rx="16" fill="#050606"/>
  <g id="title-block">
    <text x="56" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="112" font-weight="700" fill="#E5E7EB" textLength="186" lengthAdjust="spacingAndGlyphs">ccs</text>
    <rect x="250" y="44" width="16" height="88" fill="#D24FD6"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="42">
