[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap repository
tap = "materkey/homebrew-ccs"
# Publish Homebrew formula on release
publish-jobs = ["homebrew"]
# Override formula name to match binary name
formula = "ccs"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Archive format for unix
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Runtime dependencies for Homebrew formula
[dist.dependencies.homebrew]
ripgrep = { stage = ["run"] }

# GitHub retired the macos-14 runner that dist 0.31.0 picks for Apple Silicon.
# Drop this table once an upgraded dist defaults to a supported runner.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
